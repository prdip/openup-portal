<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify client</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN"
        crossorigin="anonymous"></script>
</head>
<style>
    .verify {
        text-align: center;
    }
</style>
<body>
    <div class="container">
        <div class="row">
            <div class="col-md-12 verify" style="margin-top: 5%">
                <h2>Openup Services</h2>
            </div>
            <div class="col-md-12 verify" style="margin-top: 10%;">
                <h2>Verify Your email</h2>
            </div>
        </div>
        <div class="row" style="align-items: center; justify-content: center;">
            <div class="col-md-5 card mb-0">
                <div class="card-body verify">
                    <form method="post" action="{% url 'verify_client' %}">
                        {% csrf_token %}
                        <div class="col-md-12 verify">
                            <div>
                                <input type="hidden" value="{{email}}" name="email">
                                <h5><label for="name">click on verify &nbsp;</label>
                                </h5><button type="submit" class="btn btn-primary">Verify</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
