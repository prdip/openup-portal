<!DOCTYPE html>
<html>
<head>
	<title>Openup Login</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
</head>
<body>
<style type="text/css">
 @import url("https://fonts.googleapis.com/css?family=Lato");
* {
  box-sizing: border-box;
}

a {
  color: #5266DD;
  text-decoration: none;
}

body {
  background: #F9F9F9;
  font-family: "Lato", Helvetica, Arial, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  margin: 0;
}

.wrapper {
  margin: 0 auto;
  padding: 32px 0 15px;
  width: 300px;
}

/************************
  HEADER
 */
.header {
  text-align: center;
}
.header svg {
  fill: #2f363c;
}
.header h1 {
  color: #24292e;
  font-size: 24px;
  font-weight: 300;
  letter-spacing: -0.5px;
}

/************************
  FORM
 */
.form {
  background: #FFF;
  border: 1px solid #DDD;
  border-radius: 4px;
  padding: 10px 15px;
  font-size: 15px;
}
.form label {
  color: #24292e;
  font-size: 12px;
  font-weight: 600;
}
.form label[for=password] span {
  color: #0366d6;
  float: right;
}
.form input {
  border-radius: 2px;
  margin: 10px 0;
  padding: 9px 7px;
  width: 100%;
}
.form .field {
  border: 1px solid #ddd;
}
.form .field:focus {
  border: 1px solid #0366D9;
  outline-color: rgba(37, 149, 255, 0.2);
  outline-style: solid;
  outline-width: 3px;
}
.form .button {
  background: #2DB84C;
  border: 1px solid #28a444;
  border-radius: 2px;
  color: #FFF;
  cursor: pointer;
  font-weight: 600;
}
.form .button:hover {
  background: #28a444;
}

/************************
  CREATE ACCOUNT
 */
.create-account {
  border: 1px solid #DDD;
  color: #0b0b0b;
  margin-top: 17px;
  text-align: center;
}

/************************
  FOOTER
 */
.footer {
  font-size: 12px;
  margin-top: 80px;
}
.footer ul {
  list-style-type: none;
}
.footer li {
  display: inline-block;
  margin: 0 5px;
}
.footer a {
  color: #323232;
  text-decoration: none;
}
.footer a:hover {
  color: #0366D6;
  text-decoration: underline;
}
</style>


<div class="wrapper">
  <header class="header">
    <a href="#" class="logo">
             
      <svg
         width="20mm"
         height="20mm"

         xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
         xmlns="http://www.w3.org/2000/svg"

              <path
                 d="m 29.697328,31.904754 -2.208344,1.461659 c 0.03455,0.02031 0.06908,0.04061 0.103187,0.06325 l 2.663666,1.763173 c 1.255051,0.830738 1.255051,2.674038 0,3.504776 l -0.45548,0.30152 c 1.382713,0.810577 3.155236,-0.18169 3.155236,-1.815571 v -3.526333 c 1.58e-4,-1.674804 -1.862376,-2.676371 -3.258265,-1.75247 z"

            <ellipse
               style="opacity:1;fill:#000000;fill-opacity:0;stroke:#121e49;stroke-width:1.779;stroke-dasharray:none;stroke-opacity:1"
               id="path10225"
               cx="48.14584"
               cy="49.130688"

               ry="50.512344" />
          </g>
        </g>
      </svg>

    </a>
    <h1>Sign in to Openup</h1>
  </header>
  
  <form class="form" id="login-form">
    {% csrf_token %}
    <label for="user">
      Username or email address
      <input class="field" type="email" name="email" id="email" autofocus>
    </label>
    <label for="password">
      Password <span><a href="#">Forgot password?</a></span>
      <input class="field" type="password" name="password" id="password">
    </label>
    
    <input class="button" type="submit" value="Sign in">
  </form>
  
  <div class="create-account">
    <p>
      New to Openup? <a href="#" class="text-right">Create an account.</a>
    </p>
  </div>
  
  <footer class="footer">
    <ul>
      <li><a href="#">Terms</a></li>
      <li><a href="#">Privacy</a></li>
      <li><a href="#">Security</a></li>
      <li><a href="#">Contact Github</a></li>
    </ul>
  </footer>
</div>

<script>
    $(document).ready(function (e) {
      $(document).on("submit", "#login-form", function (e) {
     
        e.preventDefault();
        
        $.ajax({
          type: "POST",  
          url: "do-login",
          dataType: 'json',
          data: new FormData(this),
          processData: false,
          contentType: false,
          csrfmiddlewaretoken: '{{ csrf_token }}',

          
          success: function (data) {
           
            // JSON.parse(data)
            if (data.status == 200) {

              window.open("{% url 'logs' %}",'_self');

              
            }
            if (data.status == 400) {
              $('#msg').text(data.message);
              alert(data.message)
            }
          },
        });

        return false;
      });
    });
</script>
</body>
</html>
