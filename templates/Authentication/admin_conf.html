<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Confirmation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js" integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">

        <div class="row">

            <div class="col-md-12" style="align-content: center; margin-top: 10%;">
                    <h2>Employee Details</h2>
            </div>

        </div>
        <div class="row">
            <div class="col-md-12">
                <div class="card mb-0">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-12">
                                <div class="profile-view">
                                    <div class="profile-basic">
                                        <div class="row">
                                            <form method="post" action="{% url 'activate' %}">
                                                {% csrf_token %}
                                                <div class="col-md-5">
                                                    <div class="profile">
                                                        <input type="hidden" name="id" value="{{user.user_id}}"/>
                                                    <h5><label for="name">Employee Name: &nbsp;</label>{{user.user_first_name}} {{user.user_middle_name}}
                                                        {{user.user_last_name}}</h5>
                                                    
                                                </div>
                                            </div>
                                            <div class="col-md-7">
                                                <ul class="personal-info" style="list-style: none;">
                                                    <li>
                                                        <div class="title">Mobile Number:</div>
                                                        <div class="text"><a href="">{{user.user_phone_number}}</a>
                                                        </div>
                                                    </li>

                                                    <li>
                                                        <div class="title">Email:</div>
                                                        <div class="text"><a href="">{{user.user_email}}</a>
                                                        </div>
                                                    </li>

                                                 


                                                    <li>
                                                        <div>
                                                            <button type="submit" class="btn btn-primary" >Activate Account</button>
                                                        </div>
                                                    </li>
                                                  
                                                </ul>
                                            </div>
                                            </form>
                                        </div>
                                    </div>
                                    
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>


<script>

    function activate_account(){

    }
</script>

</body>
</html>
