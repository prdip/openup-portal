    <body>
		<!-- Main Wrapper -->
        <div class="main-wrapper">
		
			<!-- Header -->
            <div>
			
				
				<!-- Header Title -->
                <div class="page-title-box col-md-12 " style="text-align: center; margin-top: 50px;">
					<h3>Reset Password</h3>
                </div>
				<!-- /Header Title -->
            </div>
			<!-- /Header -->
						
			<!-- Page Wrapper -->
            <div class="page-wrapper">
                <div class="content container-fluid">
					<div class="row">
						<div class="col-md-6 offset-md-3">
						
							
							
							<form method="post" id="update-pass" enctype="multipart/form-data">
								{% csrf_token %}
								<div class="col">
									{% if messages %}
									<ul class="messages">
										{% for message in messages %}
										<li style="text-decoration: underline solid  ; font-size: large; background-color: rgb(133, 204, 75); " {% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>

										{% endfor %}
									</ul>
									{% endif %}
								</div>
								<div class="form-group">
									<label>New password</label>
									<input type="password" class="form-control" name="new_pass">
									<input type="hidden" name="token" id="token" value="{{token}}">
								</div>
								<div class="form-group">
									<label>Confirm password</label>
									<input type="password" class="form-control" name="confirm_pass">
								</div>
								<div class="submit-section">
									<button class="btn btn-primary btn submit">Update Password</button>
								</div>
							</form>
						</div>
					</div>
				</div>
				<!-- /Page Content -->
				
			</div>
			<!-- /Page Wrapper -->
			
        </div>
		<!-- /Main Wrapper -->
		
			
<script>


</script>
    </body>
</html>
